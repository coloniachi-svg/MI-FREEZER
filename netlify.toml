[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Frontend calls /api/backend -> Netlify function
[[redirects]]
  from = "/api/backend"
  to = "/.netlify/functions/backend"
  status = 200

# SPA fallback for React router / deep paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
