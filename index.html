<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>❄️ Mi Freezer - Control de Inventario</title>
    <meta name="description" content="Aplicación web PWA profesional y optimizada para celular para gestionar el inventario de tu freezer con Google Sheets." />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mi Freezer" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta property="og:title" content="Mi Freezer" />
    <meta property="og:description" content="Control de inventario inteligente y rápido para tu freezer con Google Sheets." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <script>
      (function () {
        // HMR is disabled in AI Studio environment. Filter WebSocket closing error.
        var origConsoleError = console.error;
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (
              typeof arg === 'string' &&
              (arg.indexOf('WebSocket closed without opened') !== -1 ||
               arg.indexOf('[vite] Error: WebSocket') !== -1)
            ) {
              return;
            }
          }
          return origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function (event) {
          if (
            event.message &&
            (event.message.indexOf('WebSocket') !== -1 ||
             event.filename && event.filename.indexOf('@vite/client') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          if (
            event.reason &&
            (String(event.reason).indexOf('WebSocket') !== -1 ||
             String(event.reason && event.reason.stack).indexOf('@vite/client') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-sky-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
